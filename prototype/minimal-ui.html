<!doctype html>
<!-- THROWAWAY PROTOTYPE: compare three minimal control arrangements on the same annotated canvas. -->
<html lang="en"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>MyPad — minimal UI prototype</title>
<style>
*{box-sizing:border-box}body{margin:0;background:#e9eae7;color:#28382f;font:14px system-ui,-apple-system,sans-serif}button{font:inherit;cursor:pointer;border:0}button:focus-visible{outline:3px solid #6b9b80;outline-offset:4px}.stage{width:min(1050px,94vw);margin:34px auto 120px}.caption{display:flex;justify-content:space-between;margin:0 0 15px;color:#657069;font-size:12px}.screen{position:relative;aspect-ratio:4/3;background:#fafaf7;border-radius:24px;overflow:hidden;box-shadow:0 24px 65px #35453a17;border:1px solid #ffffff}.board{position:absolute;width:100%;height:100%;touch-action:none}.controls{position:absolute;display:flex;gap:1px;padding:5px;background:#ffffffd9;border:1px solid #dfe4dd;border-radius:18px;box-shadow:0 3px 12px #2039290b;backdrop-filter:blur(16px)}.control{width:40px;height:40px;border-radius:12px;color:#425c4b;background:transparent;display:grid;place-items:center}.control:hover,.control.active{background:#e7eee7}.control svg{width:20px;height:20px;fill:none;stroke:currentColor;stroke-width:1.6;stroke-linecap:round;stroke-linejoin:round}.control:disabled{opacity:.3;cursor:default}.light{position:absolute;right:22px;top:22px;width:10px;height:10px;border-radius:50%;background:#5b966d;box-shadow:0 0 0 5px #5b966d0c;padding:0}.light.offline{background:#b46d65;box-shadow:0 0 0 5px #b46d650c}.undo-controls{bottom:22px;left:22px}.tools-control{bottom:22px;right:22px}.variant-A .undo-controls{left:50%;transform:translateX(-50%)}.variant-A .tools-control{right:auto;left:calc(50% + 58px)}.variant-C .undo-controls{bottom:auto;top:50%;left:18px;transform:translateY(-50%);flex-direction:column}.variant-C .tools-control{bottom:auto;top:calc(50% + 59px);left:18px;right:auto}.palette{position:absolute;bottom:82px;right:22px;display:flex;gap:6px;align-items:center;border:1px solid #dfe4dd;background:#fffffff0;box-shadow:0 5px 25px #2039290c;border-radius:18px;padding:10px}.palette[hidden]{display:none}.variant-A .palette{right:auto;left:50%;transform:translateX(-50%)}.variant-C .palette{bottom:auto;top:50%;left:78px;right:auto;transform:translateY(-50%);flex-direction:column}.swatch{width:26px;height:26px;border-radius:50%;background:var(--ink);border:4px solid white;outline:1px solid transparent}.swatch.selected{outline-color:#7d8e80}.divider{height:24px;width:1px;background:#e0e4dd;margin:0 5px}.variant-C .divider{height:1px;width:24px;margin:5px}.prototype-bar{position:fixed;bottom:18px;left:50%;transform:translateX(-50%);background:#223a2c;color:#fff;border-radius:18px;padding:9px 12px;display:flex;gap:12px;align-items:center;box-shadow:0 8px 25px #20392925;white-space:nowrap}.prototype-bar button{background:#ffffff15;border-radius:9px;color:white;padding:8px 12px}.prototype-bar label{min-width:155px;text-align:center}.state{font-size:11px;color:#c2d2c5}.hint{margin-top:13px;font-size:12px;color:#727b73}.mode-label{color:#758174;font-size:11px;margin-right:6px}@media(max-width:650px){.stage{width:100vw;margin:0 0 135px}.caption,.hint{padding:12px}.screen{border-radius:0;aspect-ratio:3/4}.prototype-bar{flex-wrap:wrap;justify-content:center;max-width:96vw;width:390px}.state{width:100%;text-align:center}}
</style>
<div class="stage"><div class="caption"><span>THROWAWAY UI STUDY · MyPad</span><span>Same canvas, three control arrangements</span></div>
<main class="screen" aria-label="iPad canvas preview">
<svg class="board" viewBox="0 0 1050 788" aria-label="Wireframe with example handwriting">
<g fill="none" stroke="#d4dbd2" stroke-width="1.5"><rect x="188" y="146" width="674" height="474" rx="11"/><path d="M188 201H862M354 201V620"/><rect x="392" y="247" width="426" height="179" rx="6"/><rect x="392" y="464" width="126" height="111" rx="6"/><rect x="542" y="464" width="126" height="111" rx="6"/><rect x="692" y="464" width="126" height="111" rx="6"/></g>
<g fill="#98a596" font-family="system-ui" font-size="13"><text x="217" y="180">Workspace</text><text x="742" y="180">Overview</text><text x="217" y="249">Projects</text><text x="217" y="287">Activity</text><text x="217" y="325">Settings</text><text x="411" y="278">Recent work</text></g>
<g stroke="#dce2d9" stroke-width="7" stroke-linecap="round"><path d="M416 309H724M416 334H773M416 359H660M416 384H748"/></g>
<g class="example-ink" fill="none" stroke="#335f4d" stroke-width="2.8" stroke-linecap="round" stroke-linejoin="round"><path d="M375 442C480 429 721 436 833 445M823 437L837 445L825 454"/><path d="M375 437C357 407 370 299 375 256"/><path d="M828 299C861 274 891 267 920 250M902 250L923 248L916 269"/><path d="M672 530C670 447 836 439 839 519C843 594 672 601 672 530"/></g>
<g class="example-ink" fill="#335f4d" font-family="cursive" font-style="italic" font-size="24"><text x="445" y="682" transform="rotate(-3 445 682)">Could this feel quieter?</text><text x="786" y="232" transform="rotate(4 786 232)">less detail here</text></g>
</svg>
<button class="light" title="Prototype only: toggle simulated connectivity" aria-label="Connected (simulated)"></button>
<div class="controls undo-controls"><button class="control undo" aria-label="Undo sample annotation"><svg viewBox="0 0 24 24"><path d="M8 5L3 10L8 15M3 10H14A6 6 0 0 1 14 22"/></svg></button><button class="control redo" disabled aria-label="Redo sample annotation"><svg viewBox="0 0 24 24"><path d="M16 5L21 10L16 15M21 10H10A6 6 0 0 0 10 22"/></svg></button></div>
<div class="controls tools-control"><button class="control tools" aria-label="Drawing tools" aria-expanded="false"><svg viewBox="0 0 24 24"><path d="M5 19L6 14L17 3L21 7L10 18L5 19ZM14 6L18 10M4 22H20"/></svg></button></div>
<div class="palette" hidden aria-label="Drawing tools"><button class="control active tool" data-tool="pen" aria-label="Pen"><svg viewBox="0 0 24 24"><path d="M5 19L6 14L17 3L21 7L10 18L5 19ZM14 6L18 10"/></svg></button><button class="control tool" data-tool="eraser" aria-label="Eraser"><svg viewBox="0 0 24 24"><path d="M3 14L13 4L21 12L12 21H9L3 14ZM7 10L15 18M12 21H22"/></svg></button><span class="divider"></span><button class="swatch selected" style="--ink:#335f4d" aria-label="Green ink" data-color="green"></button><button class="swatch" style="--ink:#263e5f" aria-label="Blue ink" data-color="blue"></button><button class="swatch" style="--ink:#b96952" aria-label="Red ink" data-color="red"></button></div>
</main><p class="hint">Tap the pen to reveal tools. Undo/redo affects the sample ink. The dot simulates connection state. Drawing and device connectivity are not implemented.</p></div>
<div class="prototype-bar"><button id="previous" aria-label="Previous variant">←</button><label id="variant-name"></label><button id="next" aria-label="Next variant">→</button><span class="state" id="state"></span></div>
<script>
const names={A:'Bottom cluster',B:'Split corners',C:'Side rail'};let variant=new URLSearchParams(location.search).get('variant')||'A';if(!names[variant])variant='A';let palette=false,online=true,ink=true,tool='pen',color='green';const $=s=>document.querySelector(s);
function render(){ $('.screen').className='screen variant-'+variant;$('.palette').hidden=!palette;$('.tools').classList.toggle('active',palette);$('.tools').setAttribute('aria-expanded',palette);$('.light').classList.toggle('offline',!online);$('.light').setAttribute('aria-label',(online?'Connected':'Disconnected')+' (simulated)');document.querySelectorAll('.example-ink').forEach(e=>e.style.display=ink?'':'none');$('.undo').disabled=!ink;$('.redo').disabled=ink;$('#variant-name').textContent=variant+' · '+names[variant];$('#state').textContent=`tools ${palette?'open':'hidden'} · ${tool} / ${color} · ink ${ink?'visible':'undone'} · ${online?'connected':'offline'} (simulated)`;document.querySelectorAll('.tool').forEach(e=>e.classList.toggle('active',e.dataset.tool===tool));document.querySelectorAll('.swatch').forEach(e=>e.classList.toggle('selected',e.dataset.color===color))}
function cycle(delta){variant=Object.keys(names)[(Object.keys(names).indexOf(variant)+delta+3)%3];let u=new URL(location);u.searchParams.set('variant',variant);history.replaceState(null,'',u);render()}
$('#previous').onclick=()=>cycle(-1);$('#next').onclick=()=>cycle(1);$('.tools').onclick=()=>{palette=!palette;render()};$('.light').onclick=()=>{online=!online;render()};$('.undo').onclick=()=>{ink=false;render()};$('.redo').onclick=()=>{ink=true;render()};document.querySelectorAll('.tool').forEach(e=>e.onclick=()=>{tool=e.dataset.tool;render()});document.querySelectorAll('.swatch').forEach(e=>e.onclick=()=>{color=e.dataset.color;render()});document.addEventListener('keydown',e=>{if(e.target.closest('input,textarea,[contenteditable]'))return;if(e.key==='ArrowLeft')cycle(-1);if(e.key==='ArrowRight')cycle(1);if(e.key==='Escape'){palette=false;render()}});render();
</script></html>
